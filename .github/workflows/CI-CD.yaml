name: CI-CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'manifests/**'
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4
      - name: log in to docker hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
      - name: Build image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/quote-gitops:${{ github.sha }} ./app
      - name: Push image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/quote-gitops:${{ github.sha }}
  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up yq
        run: sudo snap install yq

      - name: Update image tag in manifest
        run: |
          yq -i '.spec.template.spec.containers[0].image = "${{ secrets.DOCKERHUB_USERNAME }}/quote-gitops:${{ github.sha }}"' manifests/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/deployment.yaml
          git commit -m "ci: deploy ${{ github.sha }}" || echo "No changes to commit"
          git push
